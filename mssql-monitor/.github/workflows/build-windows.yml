name: Build Windows EXE
# Автоматическая сборка MSSQLMonitor.exe в облаке GitHub:
# 1. Создайте репозиторий и загрузите туда файлы проекта
# 2. Вкладка Actions -> Build Windows EXE -> Run workflow
# 3. Готовый EXE появится в Artifacts (без установки Python на ваш ПК)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build GUI EXE
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name MSSQLMonitor --collect-all pymssql app.py
      - name: Build CLI EXE
        run: |
          pyinstaller --clean --noconfirm --onefile --console --name MSSQLMonitorCLI --collect-all pymssql app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MSSQLMonitor
          path: |
            dist/MSSQLMonitor.exe
            dist/MSSQLMonitorCLI.exe
