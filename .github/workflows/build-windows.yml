name: Build Windows packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — test and build Windows EXE
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: 2.0.${{ github.run_number }}.${{ github.run_attempt }}
    defaults:
      run:
        working-directory: mssql-monitor-go
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mssql-monitor-go/go.mod
          cache-dependency-path: mssql-monitor-go/go.sum

      - name: Download modules
        run: go mod download

      - name: Run static checks and tests
        run: |
          go vet ./...
          go test ./...

      - name: Verify injected build version
        run: go run -ldflags "-X main.Version=$BUILD_VERSION" . -version | grep -F "MS SQL Monitor $BUILD_VERSION"

      - name: Build GUI and CLI binaries
        run: |
          mkdir -p ../artifacts/go
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui -X main.Version=$BUILD_VERSION" -o ../artifacts/go/MSSQLMonitor.exe .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.Version=$BUILD_VERSION" -o ../artifacts/go/MSSQLMonitorCLI.exe .

      - name: Upload Go Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: mssql-monitor-go-windows-v2.0.${{ github.run_number }}.${{ github.run_attempt }}
          path: artifacts/go/*.exe
          if-no-files-found: error
          retention-days: 14

  python:
    name: Python — test and build Windows EXE
    runs-on: windows-latest
    env:
      BUILD_VERSION: 2.0.${{ github.run_number }}.${{ github.run_attempt }}
    defaults:
      run:
        working-directory: mssql-monitor
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mssql-monitor/requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Set application build version
        shell: pwsh
        run: |
          "# Generated by GitHub Actions for this build." | Set-Content -Path version.py -Encoding utf8
          "VERSION = '$env:BUILD_VERSION'" | Add-Content -Path version.py -Encoding utf8
          python app.py --version

      - name: Validate Python source
        run: python -m py_compile app.py analysis.py checks.py db.py demo.py monitor.py report.py storage.py version.py

      - name: Generate a demo report
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $demoReport = Join-Path $env:RUNNER_TEMP 'mssql-monitor-demo-report.html'
          python -u app.py --demo-report $demoReport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $demoReport)) { throw 'Demo report was not created.' }

      - name: Build GUI and CLI binaries
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name MSSQLMonitor --collect-all pymssql app.py
          python -m PyInstaller --clean --noconfirm --onefile --console --name MSSQLMonitorCLI --collect-all pymssql app.py

      - name: Upload Python Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: mssql-monitor-python-windows-v2.0.${{ github.run_number }}.${{ github.run_attempt }}
          path: mssql-monitor/dist/*.exe
          if-no-files-found: error
          retention-days: 14
