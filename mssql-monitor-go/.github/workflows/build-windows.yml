name: Build Windows EXE (Go)
# Автоматическая сборка MSSQLMonitor.exe (Go-версия) в облаке GitHub:
# 1. Создайте репозиторий и загрузите туда файлы каталога mssql-monitor-go
# 2. Вкладка Actions -> Build Windows EXE (Go) -> Run workflow
# 3. Готовые EXE появятся в Artifacts (Go и на ПК ставить не нужно)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Проверка (vet + форматирование)
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
      - name: Дымовой тест (демо-отчёт без сервера)
        run: |
          go build -o /tmp/mssqlmon .
          /tmp/mssqlmon -demo-report
      - name: Сборка Windows-бинарников (кросс-компиляция)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o release/MSSQLMonitor.exe .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o release/MSSQLMonitorCLI.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: MSSQLMonitor-Go
          path: |
            release/MSSQLMonitor.exe
            release/MSSQLMonitorCLI.exe
            release/demo_report.html
